spring.application.name=sulgilddara
# Server Port
server.port=
# Oracle Connection Setting
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=
spring.datasource.password=
# Mybatis Configuration
mybatis.configuration.jdbc-type-for-null=null
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.makjan.sulgilddara
mybatis.mapper-locations=classpath:/mappers/*-mapper.xml
# File Upload Configuation
# one file max size
spring.servlet.multipart.max-file-size=104857600
# http request max size
spring.servlet.multipart.max-request-size=52428800
#Thymeleaf Setting
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# smtp Setting
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.default-encoding=utf-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#SQL Logging
logging.level.org.mybatis=DEBUG
# OpenAI API Configuration
openai.model=gpt-3.5-turbo
openai.api.key=
openai.api.url= https://api.openai.com/v1/chat/completions
#Elasticsearch settings
elasticsearch.url=http://localhost:9200
elasticsearch.indexing.enabled=false
elasticsearch.index.board-posts=board-posts-v6
# Outbox 설정
outbox.polling-delay=10000
outbox.batch-size=20
outbox.max-retries=5
board.upload.directory=C:/uploadFile/board/